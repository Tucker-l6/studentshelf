<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Buy, sell, rent, and rehome with verified Babson students.">
<meta name="theme-color" content="#0F3D2A">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%20%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2213%22%20fill%3D%22%230F3D2A%22/%3E%3Cg%20transform%3D%22translate%28-1.2%201%29%22%20fill%3D%22none%22%20stroke%3D%22%23F2F5EF%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M32.5%2014H20a5.75%205.75%200%200%200%200%2011.5h8a5.75%205.75%200%200%201%200%2011.5H14.5%22%20stroke-width%3D%224.2%22/%3E%3Cpath%20d%3D%22M18.6%2033l-4%204%204%204%22%20stroke-width%3D%223.6%22/%3E%3C/g%3E%3Cpath%20transform%3D%22translate%28-1.2%201%29%22%20d%3D%22M32.6%2014.1c.3-4.8%203.6-8%208.6-8.4-.3%205-3.6%208.2-8.6%208.4z%22%20fill%3D%22%238FD19A%22/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Student Shelf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-width app column (sticky header, sectioned feed, floating tab bar) centered; feature rail to its right on wide screens */
:root{
  --bg:#F2F5EF; --outer:#E2E9DF; --surface:#FFFFFF; --ink:#0E261A; --muted:#566A5D; --line:#D8E1D3;
  --brand:#0F3D2A; --brand-2:#1E5A3E; --on-brand:#FFFFFF; --mark-bg:#0F3D2A; --mark-fg:#F2F5EF; --leaf:#8FD19A;
  --sage:#4F8F5E; --sage-soft:#DFEBDA; --heart:#C33A4A; --amber:#94600F; --amber-soft:#F5EAD3; --rent:#5A2A4D; --rent-2:#7D3B67; --on-rent:#FFFFFF; --rent-soft:#F2E4EE; --rent-pill:rgba(255,255,255,.16);
  --scrim:rgba(8,20,14,.45);
  --t1:#DAE8D4; --t2:#EDE4D0; --t3:#D8E5EE; --t4:#F0DDD3; --tile-ink:#1E4535; --tile-fill:rgba(255,255,255,.8); --glow:rgba(255,255,255,.62);
  --goal-track:rgba(255,255,255,.2); --goal-fill:#8FD19A; --c1:#1E5A3E; --c2:#4F8F5E; --c3:#8FC79A; --c4:#C9A35A; --c5:#9CB8C9;
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(16,39,28,.05),0 14px 34px rgba(16,39,28,.11);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1611; --outer:#060D09; --surface:#13201A; --ink:#E3EEE6; --muted:#93A799; --line:#23352B;
  --brand:#A3D6A6; --brand-2:#7FC08A; --on-brand:#07170E; --mark-bg:#1E5A3E; --mark-fg:#F2F5EF; --leaf:#8FD19A;
  --sage:#86BC8C; --sage-soft:#1A2F24; --heart:#F07985; --amber:#E8B866; --amber-soft:#2B2315; --rent:#E2A9CF; --rent-2:#C98AB6; --on-rent:#22101C; --rent-soft:#2C1B27; --rent-pill:rgba(0,0,0,.12);
  --scrim:rgba(0,0,0,.62);
  --t1:#1A2F24; --t2:#28261B; --t3:#182930; --t4:#2D201C; --tile-ink:#B8DCC0; --tile-fill:rgba(255,255,255,.07); --glow:rgba(255,255,255,.05);
  --goal-track:rgba(7,23,14,.16); --goal-fill:#07170E; --c1:#A3D6A6; --c2:#6FAE7C; --c3:#3F7A52; --c4:#D9B46A; --c5:#7FA3B8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1611; --outer:#060D09; --surface:#13201A; --ink:#E3EEE6; --muted:#93A799; --line:#23352B;
  --brand:#A3D6A6; --brand-2:#7FC08A; --on-brand:#07170E; --mark-bg:#1E5A3E; --mark-fg:#F2F5EF; --leaf:#8FD19A;
  --sage:#86BC8C; --sage-soft:#1A2F24; --heart:#F07985; --amber:#E8B866; --amber-soft:#2B2315; --rent:#E2A9CF; --rent-2:#C98AB6; --on-rent:#22101C; --rent-soft:#2C1B27; --rent-pill:rgba(0,0,0,.12);
  --scrim:rgba(0,0,0,.62);
  --t1:#1A2F24; --t2:#28261B; --t3:#182930; --t4:#2D201C; --tile-ink:#B8DCC0; --tile-fill:rgba(255,255,255,.07); --glow:rgba(255,255,255,.05);
  --goal-track:rgba(7,23,14,.16); --goal-fill:#07170E; --c1:#A3D6A6; --c2:#6FAE7C; --c3:#3F7A52; --c4:#D9B46A; --c5:#7FA3B8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--outer);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body[data-route="thread"] .app{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;padding-left:var(--gl);padding-right:var(--gr)}
.top.edge{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:28px;font-weight:900;letter-spacing:-.02em}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ico{width:20px;height:20px;flex:none}
.ico.sm{width:16px;height:16px}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-family:var(--display);font-weight:900;font-stretch:118%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#view{animation:viewin .22s ease-out}
@keyframes viewin{from{opacity:.4}to{opacity:1}}

/* brand */
.logo{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;text-align:left;color:var(--brand)}
.logo .mark{width:34px;height:34px;flex:none}
.logo .wm{display:grid;line-height:1}
.logo .wm small{font-family:var(--display);font-size:9px;font-weight:800;letter-spacing:.24em;color:var(--sage)}
.logo .wm b{font-family:var(--display);font-size:19px;font-weight:900;letter-spacing:-.025em;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 3px var(--sage-soft)}
.me-btn{border:0;background:none;padding:0;border-radius:50%}
.signin{height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:13px}

/* search + chips */
.search{display:flex;gap:8px;margin-top:14px}
.field-search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:15px;background:var(--surface);border:1px solid var(--line)}
.field-search:focus-within{border-color:var(--sage)}
.field-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
.field-search input::placeholder{color:var(--muted)}
.field-search .clear{border:0;background:none;color:var(--muted);padding:4px;display:grid}
.iconbtn{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:15px;border:1px solid var(--line);background:var(--surface)}
.iconbtn.bare{border:0;background:transparent;width:40px;height:40px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:12px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* home blocks */
.welcome{margin-top:4px;padding:16px;border-radius:var(--r);background:var(--sage-soft);display:grid;gap:12px}
.welcome h2{font-size:20px}
.welcome .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.welcome .step{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--ink)}
.welcome .step svg{color:var(--sage)}
.goal{margin-top:18px;width:100%;display:grid;gap:10px;padding:16px;border-radius:var(--r);border:0;text-align:left;color:var(--on-brand);background:linear-gradient(140deg,var(--brand),var(--brand-2));position:relative;overflow:hidden}
.goal .num{font-size:34px;line-height:.95}
.goal p{font-size:13px;opacity:.88}
.goal .bar{height:10px;border-radius:5px;background:var(--goal-track);overflow:hidden}
.goal .bar i{display:block;height:100%;border-radius:5px;background:var(--goal-fill)}
.goal .deco{position:absolute;right:-10px;top:-10px;width:110px;height:110px;opacity:.12;color:var(--on-brand)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.link{border:0;background:none;padding:0;font-weight:800;font-size:13px;color:var(--brand-2)}
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;margin-inline:calc(var(--gl) * -1) calc(var(--gr) * -1);padding-inline:var(--gl) var(--gr);padding-bottom:4px}
.rail::-webkit-scrollbar{display:none}
.wantcard{flex:none;width:220px;scroll-snap-align:start;padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;align-content:start}
.wantcard .t{font-weight:800;font-size:15px;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wantcard .meta{font-size:12px;color:var(--muted);display:flex;gap:10px}
.wantcard .meta b{color:var(--ink);font-variant-numeric:tabular-nums}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0;transition:transform .15s,box-shadow .15s}
@media (hover:hover){.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}}
.thumb,.hero,.mini{position:relative;display:grid;place-items:center;color:var(--tile-ink);overflow:hidden}
.thumb{aspect-ratio:1/1;max-width:100%}
.thumb > svg{width:52%;height:52%}
.t1{background:radial-gradient(circle at 50% 42%,var(--glow),transparent 62%),var(--t1)}
.t2{background:radial-gradient(circle at 50% 42%,var(--glow),transparent 62%),var(--t2)}
.t3{background:radial-gradient(circle at 50% 42%,var(--glow),transparent 62%),var(--t3)}
.t4{background:radial-gradient(circle at 50% 42%,var(--glow),transparent 62%),var(--t4)}
.art .f{fill:var(--tile-fill)}
.art .sh{fill:currentColor;opacity:.13;stroke:none}
.thumb img,.hero img,.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.heart[aria-pressed="true"]{color:var(--heart)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.tags{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tag{height:22px;padding:0 8px;border-radius:7px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:4px;background:var(--brand);color:var(--on-brand)}
.tag.hold{background:var(--amber-soft);color:var(--amber)}
.tag.want{position:absolute;left:8px;bottom:8px;background:var(--surface);color:var(--ink);text-transform:none;letter-spacing:0;font-size:11.5px;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tag.want i{width:7px;height:7px;border-radius:50%;background:var(--heart);display:inline-block}
.soldcover{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:900;letter-spacing:.14em;font-size:15px;text-align:center;line-height:1.3}
.cbody{padding:10px 11px 12px;display:grid;gap:3px;min-width:0}
.ctitle{font-weight:700;font-size:14px}
.pline{display:flex;align-items:center;gap:6px;min-width:0}
.price{font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.course{font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:5px;background:var(--t3);color:var(--tile-ink)}
.cmeta{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.lb{display:inline-flex;align-items:center;gap:3px;font-weight:800;color:var(--sage);white-space:nowrap;font-variant-numeric:tabular-nums}
.lb svg{width:13px;height:13px}
.empty{text-align:center;padding:40px 16px;color:var(--muted);display:grid;justify-items:center;gap:8px}
.empty h2{color:var(--ink)}
.empty > svg{width:46px;height:46px;color:var(--sage)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 18px;border-radius:15px;border:0;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:15px}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--sage-soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--heart);border:1px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* detail */
.hero{aspect-ratio:5/4;max-width:100%}
.hero > svg{width:44%;height:55%}
.floatbtn{position:absolute;top:12px;width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.16);color:var(--ink)}
.floatbtn.l{left:max(12px,env(safe-area-inset-left,0px))}
.hero .heart{top:12px;right:max(12px,env(safe-area-inset-right,0px));width:42px;height:42px}
.hero .tags{top:auto;bottom:12px;left:max(12px,env(safe-area-inset-left,0px))}
.detail{display:grid;gap:16px;padding-block:18px 8px}
.detail .price{font-size:30px}
.badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:800;background:var(--sage-soft);color:var(--ink)}
.badge svg{color:var(--sage)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.warn svg{color:var(--amber)}
.info{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.info > svg{color:var(--sage);margin-top:1px}
.info b{display:block;font-size:14px}
.info span{font-size:13px;color:var(--muted)}
.info.hold{background:var(--amber-soft);border-color:transparent}
.info.hold > svg{color:var(--amber)}
.info.hold span{color:var(--ink);opacity:.8}
.info.green{background:var(--sage-soft);border-color:transparent}
.info.green span{color:var(--ink);opacity:.8}
.desc{max-width:65ch}
.range{position:relative;height:8px;border-radius:4px;background:var(--line);margin:12px 0 4px}
.range .band{position:absolute;inset:0;border-radius:4px;background:var(--sage);opacity:.45}
.range .mark{position:absolute;top:-5px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.rangelbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--tile-ink)}
.avatar.lg{width:66px;height:66px;font-size:22px}
.avatar.xs{width:30px;height:30px;font-size:11px}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--sage)}
.verified svg{width:15px;height:15px}
.rel{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.rel b{color:var(--ink);font-variant-numeric:tabular-nums}

/* lists */
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;min-width:0}
.li:last-child{border-bottom:0}
.li .t{font-weight:700}
.li .s{font-size:13px;color:var(--muted)}
.mini{width:48px;height:48px;border-radius:12px;flex:none}
.mini > svg{width:62%;height:62%}
.unread{width:9px;height:9px;border-radius:50%;background:var(--heart);flex:none}
.status{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--sage-soft);color:var(--ink);white-space:nowrap}
.status.amber{background:var(--amber-soft);color:var(--amber)}
.stack{display:grid;gap:12px}

/* wanted */
.req{padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:10px}
.req h3{font-family:var(--body);font-size:16px;font-weight:800}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.matches{display:grid;gap:6px;padding:10px;border-radius:13px;background:var(--sage-soft)}
.matches .lbl{font-size:12px;font-weight:800}
.mrow{display:flex;align-items:center;gap:10px;border:0;background:var(--surface);border-radius:10px;padding:6px 8px;text-align:left;width:100%}
.mrow .mini{width:34px;height:34px;border-radius:8px}

/* impact */
.ringwrap{position:relative;display:grid;place-items:center;padding:6px 0}
.ring{width:220px;height:220px;max-width:100%}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--sage);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ringc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ringc .num{font-size:44px;line-height:.95}
.ringc span{font-size:13px;color:var(--muted)}
.equiv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.equiv .art{width:44px;height:44px;color:var(--tile-ink);flex:none}
.panel{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:12px}
.weeks{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;align-items:end;height:150px;padding-top:18px}

function bump(fn){
  const u = state.user; if (!u) return [];
  const before = earned(); fn(u); save();
  return earned().filter(b => !before.includes(b)).map(id => BADGES.find(b => b.id === id));
}
function rehome(lbs, extra = {}){

}

function rentChoice(f){
  const l = listing(f.dataset.id), days = nextDays(7);
  const day = days[+f.querySelector("input[name=rday]:checked").value];
  const plan = plans(l).find(p => p.id === f.querySelector("input[name=rplan]:checked").value);
  return {kind: "rent", l, day, plan, total: round2(l.rate + plan.price), hold: depositFor(l)};
}
function receiptHTML(c){
  if (c.kind === "rent") return `<div class="receipt">
      <div class="r"><span>Rental · ${esc(c.day.label)} to ${esc(c.day.due)}</span><span>${usd(c.l.rate)}</span></div>
      <div class="r"><span>${esc(c.plan.name)}${c.plan.id === "none" ? "" : " protection"}</span><span>${usd(c.plan.price)}</span></div>
      <div class="r tot"><span>Total today</span><span>${usd(c.total)}</span></div>
      <div class="r hold"><span class="row" style="gap:6px">${ui("lock","ico sm")}Card hold, released on return</span><span>${usd(c.hold)}</span></div></div>`;

}

function updateRentListHints(){
  const box = $("#rl-hint"); if (!box) return;
  const retail = parseFloat($("#rl-retail").value), rate = parseFloat($("#rl-rate").value);
  if (!(retail > 0)){ box.hidden = true; return; }
  const sug = Math.max(5, Math.round(retail * 0.14)), r = rate > 0 ? rate : sug;
  box.hidden = false;
  box.innerHTML = `<div class="row spread" style="flex-wrap:wrap"><span>${ui("tag","ico sm")} Babson rentals go for about <b>${usd(sug)}</b> (14% of retail)</span>${rate === sug ? "" : `<button type="button" class="btn sm soft" data-act="userate" data-id="${sug}">Use ${usd(sug)}</button>`}</div>
    <span>You earn <b>${usd(r * (1 - LENDER_FEE))}</b> per rental after the 15% Shelf fee. Renters leave a <b>${usd(depositFor({retail}))}</b> card hold, and most add protection.</span>`;
}
function updateSellHints(){
  const t = $("#s-title"); if (!t) return;
  const title = t.value.trim(); const course = $("#s-course").value || ""; const cat = $("#s-cat").value;
  const fake = {title, tags: [], course, cat};
  const w = title.length > 2 ? wantsFor(fake) : [];
  const wbox = $("#s-want");
  if (w.length){ wbox.hidden = false; wbox.innerHTML = `<div class="row" style="gap:8px">${ui("hand","ico sm")}<b>${w.length} student${w.length > 1 ? "s are" : " is"} looking for this right now</b></div><span>${w.map(r => esc(r.who.name) + (r.budget ? " (budget " + money(r.budget) + ")" : "")).join(", ")}. We'll tell them the moment you post.</span>`; }
  else wbox.hidden = true;
  const pg = title.length > 2 ? priceGuide(title) : null; const gbox = $("#s-guide");
  if (pg){ gbox.hidden = false; gbox.innerHTML = `<div class="row spread" style="flex-wrap:wrap"><span>${ui("tag","ico sm")} Sold at Babson for <b>${money(pg.lo)}–${money(pg.hi)}</b> (${pg.n} sales)</span><button type="button" class="btn sm soft" data-act="useprice" data-id="${pg.med}">Use ${money(pg.med)}</button></div>`; }
  else gbox.hidden = true;

  if (title.length > 2){ const lbs = LBS[guessIcon(title, cat)] || 5; ib.hidden = false; ib.innerHTML = `<div class="row" style="gap:8px">${ui("leaf","ico sm")}<b>Rehoming this keeps ~${lbs} lbs out of the dumpster</b></div><span>It'll count toward the Class of ${yr(U().year)} and Babson's semester goal.</span>`; }
  else ib.hidden = true;

}

const lastMsg = t => t.msgs[t.msgs.length - 1];

    ${ts.length ? `<div class="list">${ts.map(t => {

}

function handoffBox(t){
  if (t.kind === "rent") return rentBox(t);
  const other = t.with.name.split(" ")[0];
  if (t.stage === "done") return `<div class="handoff done"><div class="row">${ui("loop")}<b>Rehomed</b></div><span class="small">~${t.lbs || 3} lbs kept out of the dumpster. Nice trade.</span></div>`;
  if (t.stage !== "scheduled" || !t.pickup) return "";
  const where = `<div class="row small">${ui("pin","ico sm")}<b>${esc(t.pickup.spot)}</b> · ${esc(t.pickup.when)}</div>`;
  if (t.role === "buyer") return `<div class="handoff">${where}
    <div class="row spread" style="align-items:flex-end;flex-wrap:wrap"><div><div class="flabel" style="margin-bottom:6px">Your handoff code</div><div class="code">${t.code.split("").map(d => `<span>${d}</span>`).join("")}</div></div>
    <button class="btn sm ghost" data-act="demohandoff">Mark as handed off</button></div>
    <span class="xs muted">Show this to ${esc(other)} when you meet. It confirms the pickup for both of you.${t.paid ? ` Your ${usd(t.total)} is held until then.` : ""}</span></div>`;
  return `<div class="handoff">${where}
    <div class="flabel">Enter ${esc(other)}'s code at pickup</div>
    <form id="codeform"><input class="inp" id="hcode" inputmode="numeric" maxlength="4" placeholder="····" aria-label="Handoff code"><button class="btn sm" type="submit">Confirm</button></form>
    <span class="xs muted">${t.paid ? `You get ${usd(t.total)} as soon as the code checks out. ` : ""}Ask ${esc(other)} for their 4-digit code when you meet.</span></div>`;
}
function viewThread(){
  const t = thread(route.id); if (!t) return viewMessages();
  const l = t.listingId ? listing(t.listingId) : null;
  const strip = l ? `<button class="itemstrip" data-act="open" data-id="${l.id}">${pic(l,"mini")}
      <div class="grow"><div class="clip" style="font-weight:700">${esc(l.title)}</div><div class="small muted">${t.kind === "rent" ? usd(l.rate) + " / rental · " + esc(t.rent.day) : money(l.price) + " · " + esc(l.spot)}</div></div>${ui("right","ico sm")}</button>`
    : `<div class="itemstrip"><div class="grow small"><span class="muted">About the request:</span> <b>${esc(t.about)}</b></div></div>`;
  const msgs = t.msgs.map(m => m.kind === "pickup"
    ? `<div class="pcard ${m.from}"><div class="row">${ui("pin","ico sm")}Pickup proposed</div><div>${esc(m.spot)}</div><div class="small muted">${esc(m.when)}</div>${m.status === "confirmed" ? `<span class="verified">${ui("check","ico sm")}Confirmed</span>` : `<span class="small muted">Waiting for reply</span>`}</div>`
    : m.kind === "sys" ? `<div class="sys ${m.warn ? "warn" : ""}">${ui(m.warn ? "alert" : "check","ico sm")}${esc(m.text)}</div>`
    : `<div class="msg ${m.from}">${esc(m.text)}</div>`).join("");

  return `
  <header class="top edge">

    </div>
  </section>
  <div class="composer"><div class="composer-in">
    ${t.stage === "chat" ? `<div class="quick">
      <button class="chip" data-act="pickup">${ui("pin","ico sm")}Propose pickup</button>
      ${offer ? `<button class="chip" data-act="quick" data-id="Would you take $${Math.max(1, Math.round(l.price * 0.8))}?">Offer $${Math.max(1, Math.round(l.price * 0.8))}</button>` : ""}

    </div>` : ""}
    <form id="composer"><input class="inp" id="msgin" placeholder="Message ${esc(t.with.name.split(" ")[0])}" autocomplete="off" value="${esc(route.draft || "")}" aria-label="Message"><button class="send" type="submit" aria-label="Send">${ui("send")}</button></form>
  </div></div>`;
}

        <div class="ringc"><div class="num" id="countup" data-to="${Math.round(total)}">${reduced() ? fmt(total) : "0"}</div><span>of ${fmt(GOAL)} lbs</span><b class="small" style="color:var(--sage)">${Math.round(pct * 100)}% there</b></div>

  const to = +c.dataset.to, t0 = performance.now(), dur = 1000;

}

function openThread({listingId = null, requestId = null, withP, about = "", draft = "", role = "buyer"}){
  let t = state.threads.find(x => (listingId && x.listingId === listingId && x.role === role) || (requestId && x.requestId === requestId));
  if (!t){ t = {id: uid(), listingId, requestId, with: withP, about, role, stage: "chat", msgs: [], unread: false}; state.threads.push(t); save(); }
  go("thread", {id: t.id, draft: t.msgs.length ? "" : draft});
  return t;
}
function lbsFor(t){ const l = t.listingId ? listing(t.listingId) : null; return l ? lbsOf(l) : (LBS[guessIcon(t.about || "", "Other")] || 4); }
function reply(t, last){
  const l = t.listingId ? listing(t.listingId) : null;
  const theirs = t.msgs.filter(m => m.from === "them").length;
  if (t.kind === "rent") return ["Sounds good!","Perfect, thank you!","Got it, see you then."][theirs % 3];
  if (last.kind === "pickup"){
    last.status = "confirmed"; t.stage = "scheduled"; t.pickup = {spot: last.spot, when: last.when}; t.code = code4();
    return t.role === "buyer" ? `Works for me. See you at ${last.spot}. I'll ask for your handoff code when we meet.` : `Perfect, see you then. My handoff code is ${t.code}.`;
  }
  const txt = (last.text || "").toLowerCase();
  if (t.role === "seller") return theirs === 0 ? `Amazing! Where's easiest for you to meet?` : ["Sounds good.","Great, thank you!","Works for me."][theirs % 3];
  if (/\$\d|less|offer|lower|take/.test(txt) && l) return `Meet me in the middle at $${Math.max(1, Math.round(l.price * 0.9))} and it's yours.`;
  if (theirs === 0 && l) return `Hey! Yes, still available. I can meet at ${l.spot}. When works for you?`;
  return ["Sounds good.","Works for me.","Perfect, thanks!","Cool, I'll bring it."][theirs % 4];
}
function sendTo(t, msg){
  msg.t = Date.now(); msg.from = "me"; t.msgs.push(msg); if (route.id === t.id) route.draft = "";
  if (msg.text && OFFSITE.test(msg.text)) t.msgs.push({kind: "sys", warn: true, from: "sys", text: "Heads up: payments outside the Shelf aren't covered by protection or holds.", t: Date.now()});
  save();
  typing.add(t.id); if (route.name === "thread" && route.id === t.id) render();
  setTimeout(() => {
    const text = reply(t, msg); typing.delete(t.id);
    t.msgs.push({from: "them", text, t: Date.now()});
    const here = route.name === "thread" && route.id === t.id;
    if (!here) t.unread = true;
    save(); if (here) render(); else renderTabs();
  }, 1300 + Math.random() * 900);
}
function completeHandoff(t){
  if (t.stage === "done") return;
  t.stage = "done"; t.lbs = lbsFor(t);
  const l = t.listingId ? listing(t.listingId) : null;
  const extra = {};
  if (l){ l.sold = true; if (l.mine && l.price === 0) extra.gaveFree = true; }
  if (t.paid) state.ledger.filter(x => x.ref === t.id).forEach(x => { x.status = "paid"; });
  if (t.requestId){ const r = state.requests.find(x => x.id === t.requestId); if (r) r.filled = true; extra.filled = true; }
  state.user.handoffs = (state.user.handoffs || 0) + 1;
  t.msgs.push({kind: "sys", from: "sys", text: "Handoff confirmed with code", t: Date.now()});
  save(); render(); rehome(t.lbs, extra);
}
function simulateInterest(l){
  setTimeout(() => {
    if (!listing(l.id) || l.sold) return;
    const w = wantsFor(l)[0];
    const who = w ? w.who : {name: "Riley C.", year: "2029", handoffs: 4, rate: 100};

    const t = {id: uid(), listingId: l.id, requestId: null, with: who, about: l.title, role: "seller", stage: "chat", unread: true, paid, total: l.price,
      msgs: [{from: "them", t: Date.now(), text: paid ? `${intro} I just paid for your ${l.title.toLowerCase()} through the Shelf, so ${usd(l.price)} is held for you. Where's easiest to meet?` : `${intro} Is your ${l.title.toLowerCase()} still available?`}]};
    state.threads.push(t);
    if (paid) state.ledger.unshift({id: uid(), ref: t.id, t: Date.now(), label: `Sale: ${l.title}`, amt: l.price, status: "pending"});
    save();
    toast(`${who.name} messaged you about ${l.title}`);

  }, 4500);
}

function readPhoto(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image();
      img.onload = () => { const s = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL("image/jpeg", 0.78);
        c.toBlob(b => res({url, blob: b}), "image/jpeg", 0.85); };
      img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
async function aiFill(){
  if (!sampleFn || !draftBlob) return;
  const btn = $("#aibtn"), st = $("#aistatus");
  btn.disabled = true; st.textContent = "Looking at your photo…";
  const groups = {}; state.history.forEach(h => { const k = h.t.split(" ").slice(0, 2).join(" "); (groups[k] = groups[k] || []).push(h.p); });
  const comps = Object.entries(groups).map(([k, ps]) => `${k}: $${Math.min(...ps)}-$${Math.max(...ps)}`).join("; ");
  const prompt = `A Babson College student is listing this item on a campus resale app. Look at the photo and reply with only a JSON object:
{"title": "short listing title, max 40 characters", "category": one of ${JSON.stringify(CATS)}, "condition": one of ${JSON.stringify(CONDS)}, "price": whole US dollars a college student would pay for it used (0 if it is only worth giving away), "description": "1-2 plain sentences in a student's voice, no hype", "course": "course code if it is a textbook or course-specific item, else empty string"}
Recent sale prices on this campus for reference: ${comps}.`;
  try {
    const r = await sampleFn.json(prompt, {images: draftBlob, modelTier: "quick"});
    if (!r || typeof r !== "object") throw {code: "invalid_json"};
    if (r.title) $("#s-title").value = String(r.title).slice(0, 60);
    if (CATS.includes(r.category)) $("#s-cat").value = r.category;
    const p = Number(r.price);
    if (p === 0){ $("#s-free").checked = true; $("#s-price").value = ""; $("#s-price").disabled = true; }
    else if (p > 0){ $("#s-free").checked = false; $("#s-price").disabled = false; $("#s-price").value = Math.round(p); }
    if (CONDS.includes(r.condition)){ const c = document.querySelector(`input[name=cond][value="${r.condition}"]`); if (c) c.checked = true; }
    if (r.description) $("#s-desc").value = String(r.description).slice(0, 400);
    if (r.course){ $("#s-course").value = String(r.course).slice(0, 10); }
    updateSellHints();
    if (r.course) $("#s-coursewrap").hidden = false;
    st.textContent = "Filled in. Check it over before you post.";
  } catch (e) {
    const code = e && e.code;
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable"].includes(code)){ sampleFn = null; $("#aibox").hidden = true; toast("Auto-fill isn't available here. Fill it in yourself."); }
    else st.textContent = code === "rate_limited" ? "Too many tries. Give it a minute." : code === "image_rejected" ? "That photo didn't work. Try a JPG or PNG." : "Couldn't read that one. Try again or fill it in.";
  } finally { if (btn) btn.disabled = false; }
}

    simulateInterest(l);
  }
  if (f.id === "reqform"){
    const title = $("#r-title").value.trim(); const b = parseFloat($("#r-budget").value); const course = $("#r-course").value.trim().toUpperCase();
    if (!title) return err("#r-err", "Say what you're looking for.");
    const r = {id: uid(), title, course: course || null, budget: b > 0 ? b : 0, by: $("#r-by").value, who: {name: state.user.name, year: state.user.year, handoffs: 0, rate: 100}, posted: Date.now(), mine: true, filled: false};
    state.requests.unshift(r); save(); closeSheet(); go("wanted");
    const n = listingsFor(r).length;
    toast(n ? `Posted. ${n} listing${n > 1 ? "s" : ""} already match.` : "Posted. We'll match you when someone lists one.");
  }
  if (f.id === "pickupform"){
    const t = thread(f.dataset.thread); const spot = $("#p-spot").value, when = f.querySelector("input[name=when]:checked").value;
    closeSheet(); if (t) sendTo(t, {kind: "pickup", spot, when, status: "pending"});
  }
  if (f.id === "codeform"){
    const t = thread(route.id);
    if ($("#hcode").value.trim() === t.code) completeHandoff(t); else toast("That code doesn't match. Ask them to check their screen.");
  }
  if (f.id === "rentform"){ const c = rentChoice(f); requireVerified(() => openCheckout(c)); }
  if (f.id === "payform"){ const c = checkout; checkout = null; closeSheet(); if (c) (c.kind === "rent" ? startRental(c) : startPurchase(c)); }
  if (f.id === "rentlist"){
    const title = $("#rl-title").value.trim(), size = $("#rl-size").value.trim(), retail = parseFloat($("#rl-retail").value), rate = parseFloat($("#rl-rate").value);
    if (!title) return err("#rl-err", "Give it a name, like \"Black satin slip dress\".");
    if (!size) return err("#rl-err", "Add a size so renters know if it fits.");
    if (!(retail > 0)) return err("#rl-err", "Add what it cost new. It sets the deposit and protection limits.");
    if (!(rate > 0)) return err("#rl-err", "Set a price per rental.");
    const occ = $("#rl-occ").value;
    const l = {id: uid(), kind: "rent", title, rate: round2(rate), price: round2(rate), retail: Math.round(retail), size, occ, cat: "Clothes", cond: "Like new",
      spot: $("#rl-spot").value, desc: $("#rl-desc").value.trim(), seller: {name: state.user.name, year: state.user.year, handoffs: state.user.handoffs || 0, rate: 100},
      posted: Date.now(), icon: guessRentIcon(title, occ), photo: draftPhoto, mine: true, sold: false, tags: []};
    state.listings.unshift(l); draftPhoto = null; draftBlob = null; save();
    view.mode = "rent";
    go("item", {id: l.id, from: {name: "home"}}); toast("Listed for rent. Renters pay through the Shelf.");
    simulateRentalRequest(l);
  }
  if (f.id === "lcodeform"){
    const t = thread(route.id);
    if ($("#lcode").value.trim() === t.code){ t.stage = "out"; sys(t, `Picked up with code · due back ${t.rent.due}`); save(); render(); }
    else toast("That code doesn't match. Ask them to check their screen.");
  }
  if (f.id === "claimform"){
    const t = thread(f.dataset.thread); const cost = +f.querySelector("input[name=dmg]:checked").value;
    closeSheet(); finishLend(t, claimCalc(t.rent, cost));
  }
  if (f.id === "composer"){
    const v = $("#msgin").value.trim(); if (!v) return;
    sendTo(thread(route.id), {text: v});
  }
});

renderGuide();
render();
})();
</script>
</body>
</html>
